name: Pull request review labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  update-review-labels:
    name: update-review-labels
    if: github.event.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: pull-request-review-labels-pr-${{ github.event.pull_request.number }}
      # Keep superseded events from leaving cancelled checks on an otherwise healthy PR.
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out trusted action source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            github-actions/pr-review-labeler

      - name: Update review labels
        uses: ./github-actions/pr-review-labeler
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          required-approvals: "3"
